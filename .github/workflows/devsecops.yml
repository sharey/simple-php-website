  snyk-scan:
    name: Snyk Vulnerability Scan (SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Snyk
        uses: snyk/actions/setup@master
        with:
          snyk-version: 'latest'           # or a specific version

      - name: Install snyk-to-html
        run: npm install -g snyk-to-html

      - name: Run Snyk Open Source Scan & Generate Snyk Report
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test --json-file-output=snyk-report.json || true
          snyk-to-html -i snyk-report.json -o snyk-report.html || true

      - name: Upload Snyk Report Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Snyk-Report
          path: |
            snyk-report.json
            snyk-report.html

      # Optionally monitor so issues are visible in the Snyk dashboard:
      - name: Snyk Monitor
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk monitor || true
      
      - name: Check for High/Critical Vulnerabilities
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: |
          snyk test --severity-threshold=high --json > high-severity-check.json || EXIT_CODE=$?
          if [ "${EXIT_CODE}" == "1" ]; then
            echo "High or Critical vulnerabilities found!"
            exit 1
          elif [ "${EXIT_CODE}" == "2" ]; then
            echo "No high/critical vulnerabilities found. Pipeline continues."
            exit 0
          else
            exit 0
          fi

