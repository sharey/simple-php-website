name: DevSecOps-Trial

on:
  push:
    branches:
      - devsecops-pipeline-from-cicd
  pull_request:

permissions:
  contents: read
  id-token: write
  issues: write
  pull-requests: write

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ---- Install Dependencies ----
      - name: Install composer deps
        run: composer install --no-interaction --no-progress

      # ---- Unit Tests ----
      - name: Run PHP Unit Tests
        run: vendor/bin/codecept run Unit --html

